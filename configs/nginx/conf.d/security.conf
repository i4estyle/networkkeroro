log_format security_json escape=json '{'
    '"time":"$time_iso8601",'
    '"client_ip":"$remote_addr",'
    '"area":"$security_area",'
    '"method":"$request_method",'
    '"uri":"$uri$security_query_suffix",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
'}';

map $args $security_safe_args {
    default $args;
    ~*(?:password|passwd|pass|token|auth|authorization|api[_-]?key|secret|otp|code|email)= "[REDACTED]";
}

map $security_safe_args $security_query_suffix {
    "" "";
    "[REDACTED]" "?[REDACTED]";
    default "?$security_safe_args";
}

map "$remote_addr:$request_uri" $security_loggable {
    ~^127\.0\.0\.1: 0;
    ~^::1: 0;
    ~*analysis\.json 0;
    ~*blocks_summary\.json 0;
    ~*^/security-dashboard/api/ 0;
    default 1;
}

map $request_uri $security_area {
    ~*^/wp-login\.php login;
    ~*^/wp-admin admin;
    ~*^/security-dashboard security-dashboard;
    default website;
}

limit_req_zone $binary_remote_addr zone=web_limit:10m rate=8r/s;
limit_req_zone $binary_remote_addr zone=static_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=12r/s;
limit_req_zone $binary_remote_addr zone=wp_login_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=dashboard_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=security_api_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=dashboard_conn:10m;
